# Nginx site for the blogserver API.
#
# Install to /etc/nginx/conf.d/blogserver.conf on the instance, replacing
# API_DOMAIN with the real host name, then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d API_DOMAIN
#
# Certbot rewrites this file in place: it adds the listen 443 block, the
# certificate paths, and a redirect from port 80. Do not add those by hand.

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    # Certbot writes its HTTP-01 challenge here. Must stay reachable over plain
    # HTTP even after the HTTPS redirect exists, or renewal fails.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # No CORS headers here on purpose. The NestJS app sets them itself from
    # CORS_ORIGINS; adding them at this layer too would send each header twice,
    # which browsers reject.

    client_max_body_size 2m;

    access_log /var/log/nginx/blogserver.access.log;
    error_log  /var/log/nginx/blogserver.error.log;
}
